<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Alec Fellman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Karla:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="nav-name">Alec Fellman</a>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="about.html">About</a></li>
      <li><a href="works.html">Works</a></li>
      <li><a href="listen.html">Listen</a></li>
      <li><a href="field.html">Field Recordings</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="page-content wide">
    <div class="gallery-grid fade">
      <div class="g-cell"><div class="placeholder">Image 1</div></div>
      <div class="g-cell"><div class="placeholder">Image 2</div></div>
      <div class="g-cell"><div class="placeholder">Image 3</div></div>
      <div class="g-cell"><div class="placeholder">Image 4</div></div>
      <div class="g-cell"><div class="placeholder">Image 5</div></div>
      <div class="g-cell"><div class="placeholder">Image 6</div></div>
      <div class="g-cell"><div class="placeholder">Image 7</div></div>
      <div class="g-cell"><div class="placeholder">Image 8</div></div>
      <div class="g-cell"><div class="placeholder">Image 9</div></div>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <footer>
    <span>&copy; 2026 Alec Fellman</span>
    <div class="footer-links">
   <a href="https://insomniachotel.bandcamp.com/" target="_blank" rel="noopener">Bandcamp</a>
   <a href="https://www.instagram.com/insomniachotel" target="_blank" rel="noopener">Instagram</a>
<a href="https://www.discogs.com/artist/4347754-Alec-Fellman" target="_blank" rel="noopener">Discogs</a>
<a href="https://www.imdb.com/name/nm7677478/" target="_blank" rel="noopener">IMDb</a>
    </div>
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    hamburger.addEventListener('click', () => { hamburger.classList.toggle('open'); navLinks.classList.toggle('open'); });
    navLinks.querySelectorAll('a').forEach(a => { a.addEventListener('click', () => { hamburger.classList.remove('open'); navLinks.classList.remove('open'); }); });
    const obs = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }); }, { threshold: 0.12 });
    document.querySelectorAll('.fade').forEach(el => obs.observe(el));

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('open'));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('open'); });
    document.querySelectorAll('.g-cell img').forEach(img => {
      img.addEventListener('click', () => { lightboxImg.src = img.src; lightbox.classList.add('open'); });
    });
  </script>

</body>
</html>
